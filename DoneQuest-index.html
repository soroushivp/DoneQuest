<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111318" />
  <title>DoneQuest v0</title>
  <style>
    :root{
      --bg:#0f1117;
      --panel:#171a22;
      --panel2:#1f2430;
      --text:#f4f7fb;
      --muted:#aeb7c7;
      --border:#303747;
      --gold:#ffd166;
      --green:#44d17a;
      --purple:#b36cff;
      --yellow:#f7c948;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(180deg,#0d0f14,#121621);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,textarea,select{font:inherit}
    .wrap{max-width:920px;margin:0 auto;padding:24px 16px 56px}
    .top{
      display:flex;gap:16px;align-items:center;justify-content:space-between;
      background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;
      box-shadow:0 12px 35px rgba(0,0,0,.22)
    }
    .brand{display:flex;gap:14px;align-items:center}
    .mascot{
      width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
      background:#262c39;font-size:34px;position:relative;overflow:hidden
    }
    .mascot .face{display:inline-block;transition:transform 2s ease}
    .mascot.smile .face{transform:scale(1.08) rotate(-2deg)}
    h1{margin:0;font-size:28px}
    .slogan{margin:5px 0 0;color:var(--muted);font-size:14px}
    .stats{text-align:right}
    .stars{font-weight:800;font-size:19px}
    .level{color:var(--muted);font-size:13px;margin-top:4px}
    .progress{height:8px;background:#252a35;border-radius:99px;overflow:hidden;margin-top:8px}
    .progress>div{height:100%;background:linear-gradient(90deg,var(--gold),#ff9f43);width:0%}

    .section{margin-top:22px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .section h2{margin:0;font-size:18px}
    .small{font-size:12px;color:var(--muted)}
    .quest-list{display:grid;gap:12px}
    .quest{
      background:var(--panel);border:1px solid var(--border);border-left:6px solid var(--qcolor,#6ea8fe);
      border-radius:16px;padding:15px
    }
    .quest-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
    .quest-title{font-weight:800;font-size:17px}
    .quest-meta{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.45}
    .quest-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
    .btn{
      border:1px solid var(--border);background:#242a36;color:var(--text);
      padding:9px 12px;border-radius:10px;cursor:pointer
    }
    .btn:hover{filter:brightness(1.1)}
    .btn.primary{background:#f4f7fb;color:#111318;border-color:#f4f7fb;font-weight:800}
    .btn.ghost{background:transparent}
    .btn.danger{color:#ffd5d5;border-color:#5a3338}
    .empty{color:var(--muted);padding:16px;border:1px dashed var(--border);border-radius:14px}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field{display:flex;flex-direction:column;gap:6px}
    label{font-size:12px;color:var(--muted)}
    input,textarea,select{
      width:100%;background:#111620;color:var(--text);border:1px solid var(--border);
      border-radius:10px;padding:10px
    }
    textarea{min-height:76px;resize:vertical}
    .full{grid-column:1/-1}

    .parking{display:grid;gap:10px}
    .idea{
      background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px
    }
    .idea strong{display:block}
    .idea .tag{margin-top:5px;color:var(--muted);font-size:12px}

    dialog{
      border:1px solid var(--border);background:var(--panel);color:var(--text);
      border-radius:18px;padding:0;width:min(92vw,420px)
    }
    dialog::backdrop{background:rgba(0,0,0,.65)}
    .modal{padding:20px}
    .modal h3{margin:0 0 8px}
    .time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px}
    .history{margin-top:22px;color:var(--muted);font-size:13px}
    .history-item{padding:8px 0;border-bottom:1px solid var(--border)}
    @media(max-width:650px){
      .top{align-items:flex-start}
      .stats{min-width:115px}
      .form-grid{grid-template-columns:1fr}
      .full{grid-column:auto}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mascot" id="mascot" aria-label="Sloth Knight">
          <span class="face">🦥⚔️</span>
        </div>
        <div>
          <h1>DoneQuest</h1>
          <p class="slogan">Slow is smooth. Smooth is fast.</p>
        </div>
      </div>
      <div class="stats">
        <div class="stars">⭐ <span id="stars">0</span></div>
        <div class="level">Level <span id="level">1</span></div>
        <div class="progress"><div id="levelBar"></div></div>
      </div>
    </header>

    <section class="section">
      <div class="section-head">
        <h2>Quests</h2>
        <div class="small"><span id="questCount">0</span>/10</div>
      </div>

      <div class="form-grid" style="margin-bottom:12px">
        <div class="field">
          <label>Quest name</label>
          <input id="questName" placeholder="e.g. Finish story draft" />
        </div>
        <div class="field">
          <label>Category</label>
          <select id="questCategory">
            <option value="creative">Creative</option>
            <option value="business">Business</option>
            <option value="life">Life</option>
          </select>
        </div>
        <div class="field full">
          <label>Visible done state</label>
          <input id="doneState" placeholder="What will physically exist when this is done?" />
        </div>
      </div>
      <button class="btn primary" id="addQuestBtn">Add Quest</button>

      <div class="quest-list" id="questList" style="margin-top:14px"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Parking Lot</h2>
        <div class="small">Ideas stay linked even after a quest is finished</div>
      </div>

      <div class="form-grid">
        <div class="field full">
          <label>Idea</label>
          <textarea id="ideaText" placeholder="Park an idea before it steals your focus"></textarea>
        </div>
        <div class="field">
          <label>Related quest</label>
          <select id="ideaQuest"></select>
        </div>
        <div class="field" style="justify-content:end">
          <button class="btn primary" id="addIdeaBtn">Park Idea</button>
        </div>
      </div>

      <div class="parking" id="parkingList" style="margin-top:14px"></div>
    </section>

    <section class="history">
      <h2 style="color:var(--text);font-size:18px">Completed</h2>
      <div id="historyList"></div>
    </section>
  </div>

  <dialog id="finishDialog">
    <div class="modal">
      <h3>Quest complete</h3>
      <div class="small" id="finishQuestName"></div>
      <p>How much time did you spend on this quest?</p>
      <div class="time-row">
        <div class="field">
          <label>Hours</label>
          <select id="hours"></select>
        </div>
        <div class="field">
          <label>Minutes</label>
          <select id="minutes"></select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelFinish">Cancel</button>
        <button class="btn primary" id="confirmFinish">Finish + ⭐</button>
      </div>
    </div>
  </dialog>

<script>
const QUEST_COLORS = [
  "#ff6b6b","#ff9f43","#f7c948","#44d17a","#2ed3c6",
  "#4dabf7","#6c7cff","#b36cff","#ff70a6","#c0ca33"
];
const CATEGORY_COLORS = {creative:"#b36cff", business:"#f7c948", life:"#44d17a"};

const defaultState = {
  quests: [
    {id:crypto.randomUUID(), name:"Finish one story", category:"creative", doneState:"A complete story draft exists", color:"#b36cff", status:"active"},
    {id:crypto.randomUUID(), name:"Turn one story into audio", category:"creative", doneState:"One exported ElevenLabs audio file exists", color:"#6c7cff", status:"active"},
    {id:crypto.randomUUID(), name:"Move one idea to a meaningful state", category:"business", doneState:"A concrete output exists that can be shown or tested", color:"#f7c948", status:"active"}
  ],
  ideas: [],
  stars: 0,
  history: []
};

let state = JSON.parse(localStorage.getItem("donequest-v0") || "null") || defaultState;
let finishingId = null;

const qs = s => document.querySelector(s);

function save(){ localStorage.setItem("donequest-v0", JSON.stringify(state)); render(); }
function activeAndDoneQuests(){ return state.quests; }

function render(){
  qs("#stars").textContent = state.stars;
  const level = Math.floor(state.stars/5)+1;
  qs("#level").textContent = level;
  qs("#levelBar").style.width = ((state.stars%5)/5*100)+"%";
  qs("#questCount").textContent = state.quests.length;

  const list = qs("#questList");
  const active = state.quests.filter(q=>q.status==="active");
  list.innerHTML = active.length ? "" : '<div class="empty">No active quests yet.</div>';

  active.forEach(q=>{
    const div = document.createElement("div");
    div.className = "quest";
    div.style.setProperty("--qcolor", q.color || CATEGORY_COLORS[q.category] || "#6ea8fe");
    const relatedCount = state.ideas.filter(i=>i.questId===q.id).length;
    div.innerHTML = `
      <div class="quest-top">
        <div>
          <div class="quest-title">${escapeHtml(q.name)}</div>
          <div class="quest-meta">${escapeHtml(q.category)} · Done when: ${escapeHtml(q.doneState || "You decide")}</div>
          <div class="quest-meta">${relatedCount} parked idea${relatedCount===1?"":"s"} linked</div>
        </div>
      </div>
      <div class="quest-actions">
        <button class="btn primary finish" data-id="${q.id}">Finish</button>
        <button class="btn danger remove" data-id="${q.id}">Remove</button>
      </div>`;
    list.appendChild(div);
  });

  document.querySelectorAll(".finish").forEach(b=>b.onclick=()=>openFinish(b.dataset.id));
  document.querySelectorAll(".remove").forEach(b=>b.onclick=()=>{
    if(confirm("Remove this quest? Linked parking-lot ideas will remain, but become unlinked.")){
      state.ideas.forEach(i=>{ if(i.questId===b.dataset.id) i.questId=null; });
      state.quests = state.quests.filter(q=>q.id!==b.dataset.id);
      save();
    }
  });

  const select = qs("#ideaQuest");
  select.innerHTML = '<option value="">Unlinked / General</option>';
  state.quests.forEach(q=>{
    const opt = document.createElement("option");
    opt.value=q.id;
    opt.textContent = `${q.status==="done" ? "✓ " : ""}${q.name}`;
    select.appendChild(opt);
  });

  const parking = qs("#parkingList");
  parking.innerHTML = state.ideas.length ? "" : '<div class="empty">No parked ideas.</div>';
  state.ideas.forEach(i=>{
    const q = state.quests.find(q=>q.id===i.questId);
    const div = document.createElement("div");
    div.className="idea";
    div.innerHTML = `<strong>${escapeHtml(i.text)}</strong><div class="tag">${q ? "Linked to: "+escapeHtml(q.name)+(q.status==="done"?" (finished)":"") : "General"}</div>`;
    parking.appendChild(div);
  });

  const history = qs("#historyList");
  history.innerHTML = state.history.length ? "" : '<div class="empty">Nothing finished yet.</div>';
  state.history.slice().reverse().forEach(h=>{
    const div = document.createElement("div");
    div.className="history-item";
    div.textContent = `${h.name} — ${h.time} — ⭐`;
    history.appendChild(div);
  });
}

function openFinish(id){
  finishingId=id;
  const q=state.quests.find(q=>q.id===id);
  qs("#finishQuestName").textContent=q?.name||"";
  qs("#finishDialog").showModal();
}
function slowSmile(){
  const m=qs("#mascot");
  m.classList.add("smile");
  m.querySelector(".face").textContent="🦥✨";
  setTimeout(()=>{m.classList.remove("smile");m.querySelector(".face").textContent="🦥⚔️";},2300);
}
function timeLabel(h,m){
  const parts=[];
  if(h) parts.push(h+"h");
  if(m) parts.push(m+"m");
  return parts.length ? parts.join(" ") : "0m";
}
function escapeHtml(s=""){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

for(let h=0;h<=12;h++){ const o=document.createElement("option");o.value=h;o.textContent=h;qs("#hours").appendChild(o); }
for(let m=0;m<60;m+=5){ const o=document.createElement("option");o.value=m;o.textContent=String(m).padStart(2,"0");qs("#minutes").appendChild(o); }

qs("#addQuestBtn").onclick=()=>{
  if(state.quests.length>=10) return alert("DoneQuest v0 holds up to 10 quests.");
  const name=qs("#questName").value.trim();
  if(!name) return alert("Give the quest a name.");
  const category=qs("#questCategory").value;
  const doneState=qs("#doneState").value.trim();
  const color = QUEST_COLORS[state.quests.length % QUEST_COLORS.length] || CATEGORY_COLORS[category];
  state.quests.push({id:crypto.randomUUID(),name,category,doneState,color,status:"active"});
  qs("#questName").value=""; qs("#doneState").value="";
  save();
};

qs("#addIdeaBtn").onclick=()=>{
  const text=qs("#ideaText").value.trim();
  if(!text) return alert("Write an idea first.");
  state.ideas.push({id:crypto.randomUUID(), text, questId:qs("#ideaQuest").value||null});
  qs("#ideaText").value="";
  save();
};

qs("#cancelFinish").onclick=()=>qs("#finishDialog").close();
qs("#confirmFinish").onclick=()=>{
  const q=state.quests.find(q=>q.id===finishingId);
  if(!q) return;
  const h=Number(qs("#hours").value), m=Number(qs("#minutes").value);
  q.status="done";
  state.stars += 1;
  state.history.push({questId:q.id,name:q.name,time:timeLabel(h,m),finishedAt:new Date().toISOString()});
  qs("#finishDialog").close();
  slowSmile();
  save();
};

render();
</script>
</body>
</html>
